<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Описание на услугите, финансовите инструменти и рисковете</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:#2b1a10;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
background:radial-gradient(ellipse at 20% 15%,rgba(255,205,130,.18),transparent 30%),
radial-gradient(ellipse at 80% 70%,rgba(45,18,8,.20),transparent 35%),
repeating-linear-gradient(3deg,rgba(70,32,14,.14) 0 2px,rgba(185,113,59,.08) 3px 8px,rgba(62,27,12,.12) 10px 12px),
linear-gradient(90deg,#6b4028,#9b6846 45%,#b9845d 70%,#6b4028);background-attachment:fixed}
header{position:sticky;top:0;z-index:10;padding:14px 16px;color:#fff4e8;background:rgba(55,31,19,.94);
backdrop-filter:blur(8px);box-shadow:0 2px 14px rgba(0,0,0,.30)}
.title{font-weight:750;font-size:clamp(17px,3vw,24px)}.sub{margin-top:4px;font-size:12px;opacity:.82}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
nav a,.page-link{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:7px 11px;
border-radius:9px;color:#fff8ef;text-decoration:none;background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:650}
nav a:hover,.page-link:hover{background:rgba(255,255,255,.20)}
main{width:min(980px,calc(100% - 18px));margin:18px auto 44px}
.chapter{margin-bottom:14px;padding:16px;border-radius:12px;background:rgba(55,29,16,.58);
border:1px solid rgba(255,255,255,.13);box-shadow:0 7px 20px rgba(0,0,0,.20)}
.chapter h2{margin:0 0 12px;color:#fff3e5;font-size:18px;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.page-link{min-height:40px}
footer{padding:10px 10px 28px;text-align:center;color:#ffe9d4;font-size:12px}
@media(max-width:600px){main{width:calc(100% - 8px)}.grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<header>
<div class="title">Описание на услугите, финансовите инструменти и рисковете</div>
<div class="sub">64 страници • интерактивен HTML текст • топъл дървен фон</div>
<nav><a href="#chapters">📚 Глави и раздели</a><a href="#pages">📄 Всички страници</a></nav>
</header>

<main>
<div id="chapters"></div>
<section id="pages" class="chapter">
<h2>Всички страници</h2>
<div id="all-pages" class="grid"></div>
</section>
</main>

<footer>Вариант Б: всяка страница е реален HTML текст.</footer>

<script>
const sections = [
    {
        folder: "01-razdel-l",
        title: "Раздел I — Информация за Revolut Securities Europe UAB и нейните инвестиционни услуги",
        from: 1,
        to: 8
    },
    {
        folder: "02-razdel-ll",
        title: "Раздел II — Попечителство на ценни книжа и парични средства",
        from: 9,
        to: 10
    },
    {
        folder: "03-razdel-lll",
        title: "Раздел III — Информация за трансакциите и свързаните рискове",
        from: 11,
        to: 64
    }
];

function pageFile(number) {
    return `page-${String(number).padStart(2, "0")}.html`;
}

function pageUrl(section, number) {
    return `glavi-razdeli/${section.folder}/${pageFile(number)}`;
}

const chapters = document.getElementById("chapters");
const allPages = document.getElementById("all-pages");

for (const section of sections) {
    const chapter = document.createElement("section");
    chapter.className = "chapter";

    const title = document.createElement("h2");
    title.textContent = section.title;
    chapter.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "grid";

    for (let number = section.from; number <= section.to; number++) {
        const link = document.createElement("a");
        link.className = "page-link";
        link.href = pageUrl(section, number);
        link.textContent = number;
        grid.appendChild(link);
    }

    chapter.appendChild(grid);
    chapters.appendChild(chapter);
}

for (const section of sections) {
    for (let number = section.from; number <= section.to; number++) {
        const link = document.createElement("a");
        link.className = "page-link";
        link.href = pageUrl(section, number);
        link.textContent = number;
        allPages.appendChild(link);
    }
}
</script>
</body>
</html>
